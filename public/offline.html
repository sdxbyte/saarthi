<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAARTHI — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090d16;
        color: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 420px;
        background: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.4rem;
        font-weight: 800;
      }
      p {
        margin: 0 0 20px;
        color: #94a3b8;
        font-size: 0.92rem;
        line-height: 1.55;
      }
      button {
        background: #10b981;
        color: #052e16;
        border: none;
        border-radius: 12px;
        padding: 10px 20px;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
      }
      button:hover {
        background: #34d399;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are currently offline</h1>
      <p>
        SAARTHI cached core pages and calculators are available offline, while live NRB/NEPSE feeds require a network connection.
      </p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </main>
  </body>
</html>
