name: Build Android APK & Play Store AAB

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: Build Public APK (Zero Secrets Required)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Run Unit & Security Tests
        run: npm test

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli@1.27.0

      - name: Configure Bubblewrap & Android SDK (API 35 & Build Tools 36.1.0)
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "ERROR: Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -type f -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_DIR" -type f -name "sdkmanager" 2>/dev/null | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager binary not found inside $SDK_DIR"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          # Bubblewrap CLI 1.27.0 checks for $ANDROID_HOME/bin or $ANDROID_HOME/tools
          if [ ! -e "$SDK_DIR/bin" ] && [ ! -e "$SDK_DIR/tools" ]; then
            ln -sfn "$(dirname "$SDKMANAGER")" "$SDK_DIR/bin"
          fi

          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${SDK_DIR}"
          }
          EOF

          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.1.0" "platform-tools"

      - name: Prepare Signing Keystore (Zero Secrets Needed for Public APK)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android-build
          cp twa-manifest.json android-build/twa-manifest.json

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "playstore_mode=true" >> "$GITHUB_OUTPUT"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-build/android.keystore
            ALIAS_VALUE="$KEY_ALIAS"
            STORE_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Using persistent upload keystore (Play Store .aab + Public .apk enabled)."
          else
            echo "playstore_mode=false" >> "$GITHUB_OUTPUT"
            ALIAS_VALUE="saarthi-github-apk"
            STORE_PASS="SaarthiApkKey${GITHUB_RUN_ID}"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -noprompt \
              -keystore android-build/android.keystore \
              -alias "$ALIAS_VALUE" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=SAARTHI, OU=Public Release, O=sdxbyte, L=Kathmandu, C=NP"
            echo "Building public GitHub APK with ephemeral release key (no repository secrets required)."
          fi

          # Ensure icons resolve cleanly even if production domain has not yet synced newest PWA icons
          USE_LOCAL_ICONS="false"
          if ! curl -sfI --max-time 8 "https://saarthi.dpdns.org/pwa-512x512.png" >/dev/null 2>&1; then
            USE_LOCAL_ICONS="true"
          fi

          ALIAS_VALUE="$ALIAS_VALUE" USE_LOCAL_ICONS="$USE_LOCAL_ICONS" node -e "
            const fs = require('fs');
            const p = 'android-build/twa-manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            m.signingKey = { path: './android.keystore', alias: process.env.ALIAS_VALUE };
            if (process.env.USE_LOCAL_ICONS === 'true') {
              m.iconUrl = 'http://127.0.0.1:8787/pwa-512x512.png';
              m.maskableIconUrl = 'http://127.0.0.1:8787/pwa-maskable-512x512.png';
              if (Array.isArray(m.shortcuts)) {
                m.shortcuts = m.shortcuts.map((s) => ({ ...s, chosenIconUrl: 'http://127.0.0.1:8787/pwa-192x192.png' }));
              }
            }
            fs.writeFileSync(p, JSON.stringify(m, null, 2));
          "

          echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
          echo "BUBBLEWRAP_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Generate Gradle Project & Build Signed Android APK
        run: |
          python3 -m http.server 8787 --directory public >/dev/null 2>&1 &
          ICON_SERVER_PID=$!
          trap "kill $ICON_SERVER_PID 2>/dev/null || true" EXIT

          cd android-build
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi
          bubblewrap build --skipPwaValidation

          APK_SRC=""
          if [ -f "app-release-signed.apk" ]; then
            APK_SRC="app-release-signed.apk"
          elif [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          fi

          if [ -z "$APK_SRC" ]; then
            echo "ERROR: Built APK not found."
            ls -la
            exit 1
          fi

          cp "$APK_SRC" "saarthi-v1.9.1.apk"
          cp "$APK_SRC" "saarthi-latest.apk"

          if [ "${{ steps.keystore.outputs.playstore_mode }}" != "true" ]; then
            rm -f *.aab app/build/outputs/bundle/release/*.aab
          fi

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-android-release
          path: |
            android-build/saarthi-v1.9.1.apk
            android-build/saarthi-latest.apk
            android-build/*.aab
            android-build/app/build/outputs/bundle/release/*.aab
          retention-days: 90
          if-no-files-found: error

      - name: Publish Public APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.9.1-android
          name: 'SAARTHI v1.9.1 — Android APK Download'
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ## SAARTHI Android App (v1.9.1)

            Tap **`saarthi-latest.apk`** (or **`saarthi-v1.9.1.apk`**) below on your Android phone to download and install SAARTHI directly.

            - **Direct Download Link**: https://github.com/sdxbyte/saarthi/releases/latest/download/saarthi-latest.apk
            - **Package ID**: `com.sdxbyte.saarthi`
            - **Version**: `1.9.1` (`10901`)
            - **Note**: If upgrading from an older CI-built APK without a shared signing key, uninstall the previous APK first before installing the new one.

            ### Compliance Links
            - **Privacy Policy**: https://saarthi.dpdns.org/privacy
            - **Terms of Service**: https://saarthi.dpdns.org/terms
            - **Account Deletion**: https://saarthi.dpdns.org/account-deletion
          files: |
            android-build/saarthi-latest.apk
            android-build/saarthi-v1.9.1.apk
            android-build/*.aab
            android-build/app/build/outputs/bundle/release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
