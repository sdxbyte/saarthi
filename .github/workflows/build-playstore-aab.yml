name: Build Android Play Store App Bundle (AAB & APK)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: 📱 Build Play Store AAB & Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚙️ Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Project Dependencies
        run: npm ci || npm install

      - name: 🛠️ Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: ⚙️ Pre-configure Bubblewrap Environment
        run: |
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF
          
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/tools/bin:${PATH}"
          
          # Accept Android licenses and install platform tools
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      - name: 🔑 Setup Android Build Workspace & Keystore
        run: |
          mkdir -p android-build
          cp twa-manifest.json android-build/twa-manifest.json
          
          cd android-build
          keytool -genkey -v -keystore ./android.keystore \
            -alias saarthi-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "SaarthiRelease2026@" \
            -keypass "SaarthiRelease2026@" \
            -dname "CN=SAARTHI, OU=Engineering, O=Sdxbyte, L=Kathmandu, ST=Bagmati, C=NP"
          
          echo "=== SHA-256 Fingerprint ==="
          keytool -list -v -keystore ./android.keystore -alias saarthi-key -storepass "SaarthiRelease2026@" | grep "SHA256:" || true

      - name: 🏗️ Initialize & Build Bubblewrap Android Package
        run: |
          cd android-build
          export BUBBLEWRAP_KEYSTORE_PASSWORD="SaarthiRelease2026@"
          export BUBBLEWRAP_KEY_PASSWORD="SaarthiRelease2026@"
          
          # Regenerate Android project from twa-manifest.json
          bubblewrap update --skipVersionUpgrade --manifest=twa-manifest.json
          
          # Grant executable permissions to Gradle wrapper
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi
          
          # Build signed production Play Store AAB and APK
          bubblewrap build --skipPwaValidation

      - name: 📦 Archive Play Store AAB & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-playstore-artifacts
          path: |
            android-build/*.aab
            android-build/*.apk
            android-build/app/build/outputs/bundle/release/*.aab
            android-build/app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: 🚀 Create GitHub Release with Direct Mobile Downloads
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.2-playstore
          name: 'SAARTHI v1.6.2 — Google Play Store Release Package'
          fail_on_unmatched_files: false
          body: |
            ## SAARTHI Android Play Store Release Package (v1.6.2)
            
            This release contains the signed **Google Play Store App Bundle (.aab)** and **Direct Mobile Installable APK (.apk)** compiled via automated cloud pipeline.
            
            ### Included Files:
            - **`app-release-bundle.aab`**: Ready to upload directly to Google Play Console.
            - **`app-release-signed.apk`**: Direct installable app for Android mobile devices.
            - **`assetlinks.json`**: Verified domain association file.
            
            ### Compliance Information:
            - **Package Name**: `com.sdxbyte.saarthi`
            - **Version Name**: `1.6.2`
            - **Version Code**: `10602`
            - **Privacy Policy**: https://saarthi.dpdns.org/?tab=privacy
            - **Account Deletion**: https://saarthi.dpdns.org/?tab=account-deletion
          files: |
            android-build/*.aab
            android-build/*.apk
            android-build/app/build/outputs/bundle/release/*.aab
            android-build/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
