name: Build Standalone Android APK & Play Store AAB

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**.md'
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    name: Build Standalone Server-Synced Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci || npm install

      - name: Run Unit & Security Tests
        run: npm test

      - name: Build Bundled Standalone App (Server-Synced to saarthi.dpdns.org)
        env:
          VITE_IS_NATIVE_APK: 'true'
          VITE_API_BASE_URL: 'https://saarthi.dpdns.org'
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
          VITE_APP_COMMIT_SHA: ${{ github.sha }}
        run: npx vite build

      - name: Configure Android SDK (API 35)
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "ERROR: Android SDK directory not found at $SDK_DIR"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -type f -name "sdkmanager" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_DIR" -type f -name "sdkmanager" 2>/dev/null | head -n 1)
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager binary not found inside $SDK_DIR"
            exit 1
          fi

          (yes || true) | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Resolve Platform Version from package.json
        id: meta
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "version=$PKG_VER" >> "$GITHUB_OUTPUT"
          echo "PKG_VER=$PKG_VER" >> "$GITHUB_ENV"

      - name: Generate Native Capacitor Android Project & Apply SAARTHI Assets
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

          # Stamp incrementing versionCode & SAARTHI app launcher icons
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { PNG } = require('pngjs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const parts = String(pkg.version || '2.0.0').split('.').map((n) => parseInt(n, 10) || 0);
            const semverBase = (parts[0] || 0) * 10000 + (parts[1] || 0) * 100 + (parts[2] || 0);

            // 1. Increment versionCode on every GitHub push
            const gradlePath = 'android/app/build.gradle';
            let gradle = fs.readFileSync(gradlePath, 'utf8');
            const vCode = semverBase + parseInt(process.env.RUN_NUM || '1', 10);
            gradle = gradle.replace(/versionCode\s+\d+/, 'versionCode ' + vCode);
            gradle = gradle.replace(/versionName\s+\"[^\"]+\"/, 'versionName \"' + pkg.version + '\"');
            fs.writeFileSync(gradlePath, gradle, 'utf8');
            console.log('Stamped Android versionCode=' + vCode + ', versionName=' + pkg.version);

            // 2. Render crisp SAARTHI launcher PNGs into android mipmap-* directories
            const srcBuf = fs.readFileSync('public/pwa-512x512.png');
            const srcPng = PNG.sync.read(srcBuf);

            function resizePng(targetSize) {
              const dst = new PNG({ width: targetSize, height: targetSize });
              for (let y = 0; y < targetSize; y++) {
                const sy = Math.min(srcPng.height - 1, Math.floor((y * srcPng.height) / targetSize));
                for (let x = 0; x < targetSize; x++) {
                  const sx = Math.min(srcPng.width - 1, Math.floor((x * srcPng.width) / targetSize));
                  const sIdx = (sy * srcPng.width + sx) << 2;
                  const dIdx = (y * targetSize + x) << 2;
                  dst.data[dIdx] = srcPng.data[sIdx];
                  dst.data[dIdx + 1] = srcPng.data[sIdx + 1];
                  dst.data[dIdx + 2] = srcPng.data[sIdx + 2];
                  dst.data[dIdx + 3] = srcPng.data[sIdx + 3];
                }
              }
              return PNG.sync.write(dst);
            }

            const sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
            };

            for (const [folder, px] of Object.entries(sizes)) {
              const dir = path.join('android/app/src/main/res', folder);
              if (fs.existsSync(dir)) {
                const buf = resizePng(px);
                fs.writeFileSync(path.join(dir, 'ic_launcher.png'), buf);
                fs.writeFileSync(path.join(dir, 'ic_launcher_round.png'), buf);
                fs.writeFileSync(path.join(dir, 'ic_launcher_foreground.png'), resizePng(Math.round(px * 1.5)));
              }
            }
          "

          node scripts/inject-android-updater.mjs

      - name: Prepare Signing Keystore (Zero Secrets Needed for Public APK)
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p android-release

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "playstore_mode=true" >> "$GITHUB_OUTPUT"
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android-release/android.keystore
            ALIAS_VALUE="$KEY_ALIAS"
            STORE_PASS="$KEYSTORE_PASSWORD"
            KEY_PASS="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "Using persistent keystore (Play Store .aab + Public .apk enabled)."
          else
            echo "::warning title=Ephemeral Android Signing Keystore::ANDROID_KEYSTORE_BASE64 secret is not configured. An ephemeral keystore is being generated, which prevents in-place APK upgrades over previously installed builds until persistent signing secrets are added."
            echo "playstore_mode=false" >> "$GITHUB_OUTPUT"
            ALIAS_VALUE="saarthi-github-apk"
            STORE_PASS="SaarthiApkKey${GITHUB_RUN_ID}"
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -noprompt \
              -keystore android-release/android.keystore \
              -alias "$ALIAS_VALUE" \
              -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=SAARTHI, OU=Public Release, O=sdxbyte, L=Kathmandu, C=NP"
            echo "Building standalone public GitHub APK with ephemeral release key (zero secrets required)."
          fi

          echo "SIGNING_ALIAS=$ALIAS_VALUE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASS=$STORE_PASS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASS=$KEY_PASS" >> "$GITHUB_ENV"

      - name: Compile & Sign Standalone Android APK
        run: |
          KEYSTORE_FILE="$(pwd)/android-release/android.keystore"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$SIGNING_ALIAS" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASS"

          APK_SRC=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "ERROR: Standalone release APK not produced."
            exit 1
          fi
          cp "$APK_SRC" "../android-release/saarthi-v${PKG_VER}.apk"
          cp "$APK_SRC" ../android-release/saarthi-latest.apk

          if [ "${{ steps.keystore.outputs.playstore_mode }}" = "true" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
              -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASS" \
              -Pandroid.injected.signing.key.alias="$SIGNING_ALIAS" \
              -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASS"
            AAB_SRC=$(find app/build/outputs/bundle/release -type f -name "*.aab" | head -n 1)
            if [ -n "$AAB_SRC" ]; then
              cp "$AAB_SRC" "../android-release/saarthi-v${PKG_VER}.aab"
            fi
          fi

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saarthi-android-release
          path: |
            android-release/saarthi-v*.apk
            android-release/saarthi-latest.apk
            android-release/*.aab
          retention-days: 90
          if-no-files-found: error

      - name: Publish Standalone APK to GitHub Releases
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}-android
          name: 'SAARTHI v${{ steps.meta.outputs.version }} — Standalone Android APK'
          make_latest: true
          fail_on_unmatched_files: false
          body: |
            ## SAARTHI Standalone Android App (v${{ steps.meta.outputs.version }})

            Self-contained native Android APK with the full SAARTHI UI bundled offline and live API/data synced directly to `https://saarthi.dpdns.org`.

            - **Direct Download**: https://github.com/sdxbyte/saarthi/releases/latest/download/saarthi-latest.apk
            - **Package ID**: `com.sdxbyte.saarthi`
            - **CI Build #${{ github.run_number }}**
            - **Commit**: `${{ github.sha }}`
            - **Version**: `${{ steps.meta.outputs.version }}`

            ### Compliance Links
            - **Privacy Policy**: https://saarthi.dpdns.org/privacy
            - **Terms of Service**: https://saarthi.dpdns.org/terms
            - **Account Deletion**: https://saarthi.dpdns.org/account-deletion
          files: |
            android-release/saarthi-latest.apk
            android-release/saarthi-v${{ steps.meta.outputs.version }}.apk
            android-release/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
