name: SAARTHI Deployment Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Verify Production Code
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci || npm install

      - name: 🔍 Lint & TypeCheck
        run: npm run lint

      - name: ⚡ Production Build (Vite & Express Server)
        run: npm run build
        env:
          NODE_ENV: production

      - name: 📁 Verify Production Build Artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Error: dist folder missing!"
            exit 1
          fi
          if [ ! -f "dist/server.cjs" ]; then
            echo "❌ Error: dist/server.cjs bundled server entry is missing!"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Error: dist/index.html web entry is missing!"
            exit 1
          fi
          echo "✅ All production build artifacts verified successfully."

      - name: 🚀 Deployment Status
        run: |
          echo "🎉 SAARTHI Civic Platform (v1.4.1) build passed and ready for distribution."
          echo "Commit SHA: ${{ github.sha }}"
